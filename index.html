<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yer Gösteren</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-wrapper">
        <header class="header">
            <div class="live-indicator">
                <span class="pulse-dot"></span>
                <span id="connection-status">Canlı</span>
            </div>
            <h1>Kütüphane</h1>
            <p>Anlık Doluluk Durumu</p>
        </header>

        <main class="main-content">
            <div class="capacity-container">
                <div class="capacity-ring" id="capacity-ring">
                    <div class="capacity-inner">
                        <span class="count" id="count-display">...</span>
                        <span class="person-label">Kişi İçeride</span>
                        <span class="percentage-label" id="percentage-display">... / 126 Masa</span>
                    </div>
                </div>
            </div>

            <div class="status-message hidden" id="status-message">
                <!-- Uyarı ve onay mesajları buraya gelecek -->
            </div>

            <div class="action-buttons">
                <button id="btn-enter" class="btn btn-enter">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <polyline points="10 17 15 12 10 7" />
                        <line x1="15" y1="12" x2="3" y2="12" />
                    </svg>
                    Kütüphaneye Girdim
                </button>
                <button id="btn-exit" class="btn btn-exit">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                    Kütüphaneden Ayrıldım
                </button>
            </div>
        </main>

        <img src="./qr-code.jpg" width="200" alt="Giriş QR Kodu" class="qr-code-img">
        <div class="share-btn" id="share-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            Arkadaşınla Paylaş
        </div>
        <div class="qr-info">
            Kütüphane kapısındaki QR kodları okutarak da hızlı işlem yapabilirsiniz.
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
